name: Check Epic Games Freebies

on:
  schedule:
    # Runs daily at 16:15 UTC (right after Epic rotates 24-hr daily and weekly drops)
    - cron: '15 16 * * *'
    # Optional extra check at 20:15 UTC in case of delays:
    - cron: '15 20 * * *'
  workflow_dispatch:

permissions:
  contents: write  # Needed to push the updated cache back to GitHub

jobs:
  check-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Notifier & Check Cache
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_epic.py

      - name: Commit and Push Cache Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_promotions.json || true
          if git diff --staged --quiet; then
            echo "No new games posted. Cache untouched."
          else
            git commit -m "chore: update posted promotions cache [skip ci]"
            git push
          fi
